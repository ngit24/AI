<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Modern & Fun</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Roboto Slab', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            flex-direction: column;
            padding-bottom: 40px;
        }

        #chatContainer {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chatHeader {
            background-color: #8e44ad;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #chatMessages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        .user {
            background-color: #8e44ad;
            color: white;
            align-self: flex-end;
        }

        .ai {
            background-color: #e1e1e1;
            color: #333;
            align-self: flex-start;
        }

        #loading {
            display: none;
            padding: 10px;
            text-align: center;
            color: #8e44ad;
            font-size: 0.9rem;
        }

        #inputArea {
            display: flex;
            gap: 10px;
            padding: 15px;
            background-color: #f9f9f9;
            border-top: 1px solid #ddd;
        }

        textarea {
            flex: 1;
            padding: 10px;
            border-radius: 15px;
            border: 2px solid #ddd;
            resize: none;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #8e44ad;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #732d91;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            font-size: 1.0rem;
            font-family: 'Roboto Slab', serif;
            color: #8e44ad;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="chatContainer">
        <div id="chatHeader">
            Sir Chat-a-lot
        </div>
        <div id="chatMessages"></div>
        <div id="loading">
            AI is typing...
        </div>
        <div id="inputArea">
            <textarea id="message" placeholder="Type your message..." rows="1"></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <div id="footer">
        Designed by Vardhan
    </div>

    <script>
        function formatResponse(text) {
            return text
                .replace(/##(.*?)##/g, '<strong>$1</strong>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        function addMessage(sender, text) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerHTML = formatResponse(text);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const userMessage = document.getElementById('message').value.trim();
            const loadingElement = document.getElementById('loading');

            if (!userMessage) {
                alert('Please enter a message.');
                return;
            }

            addMessage('user', userMessage);
            document.getElementById('message').value = '';
            loadingElement.style.display = 'block';

            try {
                const response = await fetch('https://vrdn-ai.89determined.workers.dev/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });

                const data = await response.json();
                loadingElement.style.display = 'none';

                if (data.reply) {
                    addMessage('ai', data.reply);
                } else {
                    addMessage('ai', 'No response received.');
                }
            } catch (error) {
                console.error('Error:', error);
                loadingElement.style.display = 'none';
                addMessage('ai', 'Error: Failed to fetch response.');
            }
        }

        document.getElementById('message').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
